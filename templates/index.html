<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Billing System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Step 1: Registration Form Card -->
        <div class="form-card" id="formCard">
            <div class="logo-circle">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            
            <h1>Smart Billing System</h1>
            <p class="subtitle">Step 1: User Registration</p>
            
            <form id="registration-form">
                <div class="input-group">
                    <i class="fa-regular fa-user icon-left"></i>
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>
                
                <div class="input-group">
                    <i class="fa-regular fa-envelope icon-left"></i>
                    <input type="email" id="email" placeholder="Email ID" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="password" placeholder="Create Password" required>
                    <i class="fa-regular fa-eye icon-right toggle-password"></i>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <i class="fa-regular fa-eye icon-right toggle-password"></i>
                </div>

                <button type="submit" class="submit-btn">
                    Next: Add Face <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
                </button>
            </form>

            <p class="footer-text">Already have an account? <a href="#">Login</a></p>
        </div>

        <!-- Step 2: Camera Section -->
        <div class="form-card hidden" id="cameraCard">
            <h2>Step 2: Add Face</h2>
            <p class="subtitle">Capture your face for smart login</p>
            
            <div class="camera-container" id="cameraContainer">
                <video id="webcam" autoplay playsinline></video>
                <div class="face-overlay"></div>
            </div>

            <!-- Preview section (hidden initially) -->
            <div class="camera-container hidden" id="previewContainer" style="border: 2px solid var(--primary-green);">
                <canvas id="snapshot" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;"></canvas>
            </div>

            <p id="cameraStatus" class="status-text" style="margin-bottom: 15px;">Initializing live camera...</p>

            <div id="fallbackUpload" class="hidden" style="margin-bottom: 15px;">
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                <button type="button" class="submit-btn" id="uploadBtn" style="background-color: #6366f1;">
                    <i class="fa-solid fa-upload"></i> Upload Photo Instead
                </button>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="button" class="submit-btn" id="captureBtn" style="background-color: #3b82f6;">
                    <i class="fa-solid fa-camera"></i> Capture Face
                </button>
                <button type="button" class="submit-btn hidden" id="retakeBtn" style="background-color: #f59e0b;">
                    <i class="fa-solid fa-rotate-right"></i> Retake
                </button>
                <button type="button" class="submit-btn hidden" id="saveRegisterBtn">
                    Save & Register
                </button>
            </div>
            
            <p class="footer-text" style="margin-top: 15px; cursor: pointer;" id="backToForm">
                <i class="fa-solid fa-arrow-left"></i> Back to Form
            </p>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <div class="check-icon"><i class="fa-solid fa-check"></i></div>
            <h2>Registration Successful!</h2>
            <p id="successMessage">User details and face have been securely saved.</p>
            <button id="closeModal" class="submit-btn" style="margin-top: 15px;">Proceed to Dashboard</button>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
