<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Billing System</title>
    <!-- Use Flask url_for for static files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Login Form Card -->
        <div class="form-card" id="loginCard">
            <div class="logo-circle">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            
            <h1>Smart Billing System</h1>
            <p class="subtitle">Login to Your Account</p>
            
            <form id="login-form">
                <div class="input-group">
                    <i class="fa-regular fa-envelope icon-left"></i>
                    <input type="email" id="loginEmail" placeholder="Email ID" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <i class="fa-regular fa-eye icon-right toggle-password"></i>
                </div>

                <button type="submit" class="submit-btn" style="margin-top: 20px;">
                    Login
                </button>
                
                <!-- Optional: Face Login Button -->
                <button type="button" class="submit-btn" id="faceLoginBtn" style="background-color: #3b82f6; margin-top: 10px;">
                    <i class="fa-solid fa-camera"></i> Login with Face
                </button>
            </form>

            <p class="footer-text">Don't have an account? <a href="{{ url_for('index') }}">Create Account</a></p>
        </div>

        <!-- Camera Section for Face Login (Initially Hidden) -->
        <div class="form-card hidden" id="cameraCard">
            <h2>Face Verification</h2>
            <p class="subtitle">Please look at the camera to login</p>
            
            <div class="camera-container" id="cameraContainer">
                <video id="webcam" autoplay playsinline></video>
                <div class="face-overlay"></div>
            </div>

            <div class="camera-container hidden" id="previewContainer" style="border: 2px solid var(--primary-green);">
                <canvas id="snapshot" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;"></canvas>
            </div>

            <p id="cameraStatus" class="status-text" style="margin-bottom: 15px;">Initializing live camera...</p>

            <div style="display: flex; gap: 10px;">
                <button type="button" class="submit-btn" id="captureBtn" style="background-color: #3b82f6;">
                    <i class="fa-solid fa-camera"></i> Scan Face
                </button>
                <button type="button" class="submit-btn hidden" id="retakeBtn" style="background-color: #f59e0b;">
                    <i class="fa-solid fa-rotate-right"></i> Retake
                </button>
                <button type="button" class="submit-btn hidden" id="verifyFaceBtn">
                    Verify Identity
                </button>
            </div>
            
            <p class="footer-text" style="margin-top: 15px; cursor: pointer;" id="backToForm">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </p>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <div class="check-icon"><i class="fa-solid fa-check"></i></div>
            <h2>Login Successful!</h2>
            <p id="successMessage">Welcome back to Smart Billing System.</p>
            <button id="closeModal" class="submit-btn" style="margin-top: 15px;">Proceed to Dashboard</button>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
